[package]
name = "moisturemind"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
cortex-m = { version = "0.7.7", features = [
    #"critical-section-single-core", # For use with SoftDevice use nrf-softdevice's critical section implementation instead.
    "inline-asm",
] }
cortex-m-rt = "0.7.5"
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", features = [
    "ble-peripheral",
    "ble-central",
    "nrf52840",
    "s140",
    "critical-section-impl",
] } # Need to use git version due to linker errors, see https://github.com/embassy-rs/nrf-softdevice/issues/304
static_cell = "2"

embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-nrf = { version = "0.11.0", features = [
    "nrf52840",
    "unstable-pac",
    "time",
    "time-driver-rtc1", # RTC0 is used by softdevice, so RTC1 should be fine.
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"


[package.metadata.cargo-shear]
ignored = ["cortex-m-rt"] # Needed for entry point
